
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Flower Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            text-align: center;
            padding: 40px 15px;
        }

        .card {
            max-width: 520px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px #0002;
        }

        h1 {
            color: #1565c0;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 25px;
            margin-top: 15px;
            background: #1565c0;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #dcfce7;
            color: #166534;
            border-radius: 8px;
        }

        .error {
            margin-top: 20px;
            color: #b91c1c;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>ML Flower Prediction</h1>

        <p>Machine Learning using Flask and scikit-learn</p>
        <p>Enter the Iris flower measurements in centimeters.</p>

        <form method="POST">
            <input type="number" name="sepal_length"
                   placeholder="Sepal Length" min="0" max="10"
                   step="any" required>

            <input type="number" name="sepal_width"
                   placeholder="Sepal Width" min="0" max="10"
                   step="any" required>

            <input type="number" name="petal_length"
                   placeholder="Petal Length" min="0" max="10"
                   step="any" required>

            <input type="number" name="petal_width"
                   placeholder="Petal Width" min="0" max="10"
                   step="any" required>

            <button type="submit">Predict Flower</button>
        </form>

        {% if prediction %}
        <div class="result">
            <h3>Predicted Species: {{ prediction }}</h3>
        </div>
        {% endif %}

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <p>Version: 1.0</p>
        <p>GitHub + CodePipeline + CodeDeploy + Docker</p>
    </div>
</body>
</html>
