```yaml
version: 0.0
os: linux

files:
  - source: /
    destination: /opt/docker-ml-app
    overwrite: true

file_exists_behavior: OVERWRITE

permissions:
  - object: /opt/docker-ml-app
    pattern: "**"
    owner: root
    group: root
    mode: 755
    type:
      - file
      - directory

hooks:
  BeforeInstall:
    - location: scripts/install_dependencies.sh
      timeout: 600
      runas: root

  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 600
      runas: root

  ValidateService:
    - location: scripts/validate_server.sh
      timeout: 120
      runas: root
```
